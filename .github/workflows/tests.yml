name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install the headless test dependencies
        # HyperSpy, napari and Julia/MAGEMin are not installed: the tests that need
        # them skip (importorskip) or exercise fakes.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas scikit-image scikit-learn matplotlib pillow tifffile h5py qtpy PyQt5 tqdm psutil pytest
      - name: Run the suite
        run: python -m pytest -q tests
