# EquiMap runtime environment — built fresh from requirements.txt.
# Solved from conda-forge, Python 3.11. This is the single source of truth the
# Windows installer (install.bat) uses; developers can also use it directly:
#
#     conda env create -f environment.yml      (or:  mamba env create -f ...)
#     conda activate equimap
#
# The MAGEMin geological backend manages its own Julia + MAGEMin_C.jl runtime;
# it is installed from PyPI here (pip section) and its Julia side is fetched by
# `python -c "import petthermotools as ptt; ptt.install_MAGEMinCalc()"`, which
# install.bat runs once after creating the env so modelling works on first launch.
name: equimap
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- SEM data I/O ---
  - hyperspy>=2.3.0          # Bruker BCF reading
  - rosettasciio>=0.10.0     # file-format backends used by HyperSpy
  - h5py>=3.0                # Oxford .h5oina (EBSD+EDS HDF5) reader
  - tifffile>=2024.1         # Oxford BSE TIFF read/write

  # --- Core numerical ---
  - numpy>=2.0
  - scipy>=1.16
  - pandas>=2.0

  # --- Image processing ---
  - scikit-image>=0.25
  - pillow>=11.0

  # --- Visualisation / GUI ---
  - matplotlib>=3.10
  - napari>=0.6.5
  - pyqt>=5.15               # conda-forge name for PyQt5 (napari Qt backend)

  # --- Phase segmentation ---
  - scikit-learn>=1.3        # PCA + GMM-ICL clustering

  # --- Thermodynamic backend (alloys/ceramics; needs a TDB file) ---
  - pycalphad>=0.11.1

  # --- Utilities ---
  - tqdm>=4.0
  - psutil>=5.9              # available-RAM probe for the large-ROI memory guard

  - pip
  - pip:
      # MAGEMin geological backend (primary). PyPI-only; manages the Julia env.
      - petthermotools==0.4.0
      # The Julia bridge. petthermotools does NOT declare these, but both
      # install_MAGEMinCalc() and the MAGEMin backend need them — without them the
      # install fails with "No module named 'juliapkg'" and modelling reports
      # "backend magemin is not installed". Versions pinned to a known-good env.
      - juliacall==0.9.31
      - juliapkg==0.1.23

# --- Optional extras (main.py scratch script ONLY — not used by the viewer or
#     thermodynamic modelling). Add by hand if you want them:
#         conda install -n equimap -c conda-forge umap-learn
#         pip install <sigma SEM package>   # verify the exact package name first
#
# --- Perple_X backend (optional, advanced): the Perple_X 7.x executables are a
#     separate download from ETH Zurich and cannot be bundled. Install them
#     manually and point the backend at the install dir. MAGEMin (above) covers
#     the modelling workflow without this.
