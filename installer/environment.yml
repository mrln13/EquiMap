# EquiMap runtime environment. Solved from conda-forge, Python 3.11. This is
# the single source of truth the Windows installer (install.bat) uses;
# developers can also use it directly:
#
#     conda env create -f environment.yml      (or:  mamba env create -f ...)
#     conda activate equimap
#
# Versions are PINNED to a tested set (2026-11-05: the 276-test suite passes and
# the napari viewer opens with exactly these; exspy added 2026-11-11, 280 tests
# pass), so every install of a release
# gets the stack it was tested with. To move to newer versions, change the pins,
# rebuild, run `pytest -q tests` and open the viewer before releasing.
#
# The MAGEMin geological backend manages its own Julia + MAGEMin_C.jl runtime;
# it is installed from PyPI here (pip section) and its Julia side is fetched by
# `python -c "import petthermotools as ptt; ptt.install_MAGEMinCalc()"`, which
# install.bat runs once after creating the env so modelling works on first launch.
name: equimap
channels:
  - conda-forge
dependencies:
  - python=3.11.15

  # --- SEM data I/O ---
  - hyperspy==2.4.0          # Bruker BCF reading
  - rosettasciio==0.14.0     # file-format backends used by HyperSpy
  - exspy==0.3.2             # HyperSpy's EDS signal types; without it every BCF
                             # read warns "signal_type='EDS_SEM' not understood"
  - h5py==3.16.0             # Oxford .h5oina (EBSD+EDS HDF5) reader
  - tifffile==2026.3.3       # Oxford BSE TIFF read/write
  - imageio==2.37.0          # image read/write (BSE mosaic)

  # --- Core numerical ---
  - numpy==2.4.6
  - scipy==1.17.1
  - pandas==3.0.3

  # --- Image processing ---
  - scikit-image==0.26.0
  - pillow==12.2.0

  # --- Visualisation / GUI ---
  - matplotlib==3.10.9
  - napari==0.7.0
  - vispy==0.16.2            # napari's OpenGL canvas
  - pyqt==5.15.11            # conda-forge name for PyQt5 (napari Qt backend)
  - qtpy==2.4.3              # Qt binding layer used by the viewer

  # --- Phase segmentation ---
  - scikit-learn==1.9.0      # PCA + GMM-ICL clustering

  # --- Thermodynamic backend (alloys/ceramics; needs a TDB file) ---
  - pycalphad==0.11.2
  - xarray==2026.4.0         # pycalphad results

  # --- Utilities ---
  - tqdm==4.68.1
  - psutil==7.2.2            # available-RAM probe for the large-ROI memory guard

  - pip
  - pip:
      # MAGEMin geological backend (primary). PyPI-only; manages the Julia env.
      - petthermotools==0.4.0
      # The Julia bridge. petthermotools does NOT declare these, but both
      # install_MAGEMinCalc() and the MAGEMin backend need them; without them the
      # install fails with "No module named 'juliapkg'" and modelling reports
      # "backend magemin is not installed". Versions pinned to a known-good env.
      - juliacall==0.9.31
      - juliapkg==0.1.23

# --- Optional extras (main.py scratch script ONLY, not used by the viewer or
#     thermodynamic modelling). Add by hand if you want them:
#         conda install -n equimap -c conda-forge umap-learn
#         pip install <sigma SEM package>   # verify the exact package name first
#
# --- Perple_X backend (optional, advanced): the Perple_X 7.x executables are a
#     separate download from ETH Zurich and cannot be bundled. Install them
#     manually and point the backend at the install dir. MAGEMin (above) covers
#     the modelling workflow without this.
